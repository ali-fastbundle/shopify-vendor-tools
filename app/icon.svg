    <rect x="10.5" y="8" width="3" height="16" rx="1.5" fill="#FFB020"/>
    <rect x="14.5" y="8" width="3" height="16" rx="1.5" fill="#FF6B8A"/>
    <rect x="18.5" y="8" width="3" height="16" rx="1.5" fill="#B08CFF"/>
    <rect x="22.5" y="8" width="3" height="16" rx="1.5" fill="#48E5C2"/>
    <rect x="26.5" y="8" width="3" height="16" rx="1.5" fill="#FF9052"/>
  </g>
</svg>
