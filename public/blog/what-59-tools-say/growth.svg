<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Tools in the directory, September to October 2026</title>
  <desc id="d2">The directory grew from 21 tools on 11 September to 59 on 31 October.</desc>
  <style>
    .ax { font: 400 12px Archivo, Inter, system-ui, sans-serif; fill: #6B7268; }
    .num { font: 700 15px Archivo, Inter, system-ui, sans-serif; fill: #0C1F17; }
    .hed { font: 700 17px Archivo, Inter, system-ui, sans-serif; fill: #0C1F17; letter-spacing: -0.01em; }
    .cap { font: 400 12px Archivo, Inter, system-ui, sans-serif; fill: #6B7268; }
    .grid { stroke: #C9CCC3; stroke-width: 0.5; }
    @media (prefers-color-scheme: dark) {
      .num, .hed { fill: #E8F2EC; }
      .ax, .cap { fill: #8CA79B; }
      .grid { stroke: rgba(255,255,255,0.12); }
    }
  </style>

  <text class="hed" x="24" y="34">Tools listed, 11 September to 31 October 2026</text>

  <line class="grid" x1="64" y1="290" x2="730" y2="290"/>
  <line class="grid" x1="64" y1="222" x2="730" y2="222"/>
  <line class="grid" x1="64" y1="154" x2="730" y2="154"/>
  <line class="grid" x1="64" y1="86" x2="730" y2="86"/>

  <text class="ax" x="52" y="294" text-anchor="end">0</text>
  <text class="ax" x="52" y="226" text-anchor="end">20</text>
  <text class="ax" x="52" y="158" text-anchor="end">40</text>
  <text class="ax" x="52" y="90" text-anchor="end">60</text>

  <polyline fill="none" stroke="#00E08A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
    points="70,219 118,209 166,178 214,164 262,154 358,147 454,130 502,127 574,110 622,106 694,96 730,89"/>

  <circle cx="70" cy="219" r="4" fill="#00E08A"/>
  <circle cx="730" cy="89" r="4" fill="#00E08A"/>

  <text class="num" x="70" y="206">21</text>
  <text class="num" x="730" y="76" text-anchor="end">59</text>

  <text class="ax" x="70" y="312">11 Sep</text>
  <text class="ax" x="730" y="312" text-anchor="end">31 Oct</text>

  <text class="cap" x="24" y="344">Each point is a day entries were added. Most came from suggestions and competitor pages.</text>
